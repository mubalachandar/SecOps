apiVersion: v1
kind: Secret
metadata:
  name: secops-secrets
  namespace: secops-ai-copilot
type: Opaque
# IMPORTANT: Provide Base64 encoded values for production via CI/CD pipelines or external secret management (e.g., Vault, AWS Secrets Manager).
stringData:
  DATABASE_URL: "postgresql://postgres:postgrespassword@secops-postgres:5432/secops"
  REDIS_URL: "redis://secops-redis:6379"
  JWT_SECRET: "replace-with-secure-32-char-min-secret"
  GEMINI_API_KEY: "replace-with-real-api-key"
