apiVersion: apps/v1
kind: Deployment
metadata:
  name: secops-backend
  namespace: secops-ai-copilot
  labels:
    app: secops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secops-backend
  template:
    metadata:
      labels:
        app: secops-backend
    spec:
      containers:
        - name: secops-backend
          image: secops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: secops-config
            - secretRef:
                name: secops-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: secops-backend-svc
  namespace: secops-ai-copilot
spec:
  selector:
    app: secops-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secops-backend-hpa
  namespace: secops-ai-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secops-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secops-backend-pdb
  namespace: secops-ai-copilot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: secops-backend
