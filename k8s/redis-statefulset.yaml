apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secops-redis
  namespace: secops-ai-copilot
spec:
  serviceName: secops-redis
  replicas: 1
  selector:
    matchLabels:
      app: secops-redis
  template:
    metadata:
      labels:
        app: secops-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: secops-redis
  namespace: secops-ai-copilot
spec:
  ports:
  - port: 6379
  selector:
    app: secops-redis
  type: ClusterIP
