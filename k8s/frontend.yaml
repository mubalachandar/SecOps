apiVersion: apps/v1
kind: Deployment
metadata:
  name: secops-frontend
  namespace: secops-ai-copilot
  labels:
    app: secops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secops-frontend
  template:
    metadata:
      labels:
        app: secops-frontend
    spec:
      containers:
        - name: secops-frontend
          image: secops-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: secops-frontend-svc
  namespace: secops-ai-copilot
spec:
  selector:
    app: secops-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secops-frontend-hpa
  namespace: secops-ai-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secops-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secops-frontend-pdb
  namespace: secops-ai-copilot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: secops-frontend
