version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: secops_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-secops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secops_pass_123}
      POSTGRES_DB: ${DB_NAME:-secops_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secops_user} -d ${DB_NAME:-secops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secops_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-secops_redis_pass_123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secops_redis_pass_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: balachandar2005/secops-backend:latest
    container_name: secops-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: balachandar2005/secops-frontend:latest
    container_name: secops-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
